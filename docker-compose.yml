name: claimshield-nexus
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: claimshield
      POSTGRES_USER: claimshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claimshield_local_demo}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimshield -d claimshield"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./backend
    environment: &backend_env
      DB_HOST: db
      DB_PASSWORD: ${POSTGRES_PASSWORD:-claimshield_local_demo}
      DATA_DIR: /data
      ARTIFACT_DIR: /artifacts
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_TIMEOUT_SECONDS: ${GROQ_TIMEOUT_SECONDS:-45}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./data:/data:ro", "./artifacts:/artifacts"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  worker:
    build: ./backend
    environment: *backend_env
    command: ["python", "-m", "app.worker"]
    volumes: ["./data:/data:ro", "./artifacts:/artifacts"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:

